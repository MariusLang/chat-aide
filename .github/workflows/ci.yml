name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The pnpm version comes from package.json's packageManager (pnpm 10).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium
        run: pnpm --filter demo exec playwright install --with-deps chromium

      - run: pnpm check
